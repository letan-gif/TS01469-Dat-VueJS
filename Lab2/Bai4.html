<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>TS01469-Dat-Bai4</title>
</head>
<body>
    <div class="container mt-3">
        <h3>Bài tập ứng dụng Modal cho Tài khoản</h3>

        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
            Tài khoản
        </button>
    </div>
    <div class="modal" id="myModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title">ĐĂNG NHẬP/ ĐĂNG KÝ</h4>
                    <buuton type="button" class="btn-close" data-bs-dismiss="modal"></buuton>
                </div>

                <div class="modal-body">
                    <div class="container mt-4">
                        <ul class="nav nav-tabs" role="tablist">
                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="tab" href="#register" role="tab">
                                    Đăng ký
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#login" role="tab">
                                    Đăng nhập
                                </a>
                            </li>
                        </ul>
                        <div class="tab-content border border-top-0 p-4">
                            <div class="tab-pane fade show active" id="register" role="tabpanel">
                                <h4 class="mb-3">Form Đăng Ký Thông Tin</h4>

                                <form class="was-validated">
                                    <div class="mb-3">
                                        <label class="form-label">Họ và Tên</label>
                                        <input type="text" class="form-control" placeholder="Nhập họ và tên" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="Nhập email" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Số Điện Thoại</label>
                                        <input type="text" class="form-control" placeholder="Nhập số điện thoại"
                                            required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Mật Khẩu</label>
                                        <input type="password" class="form-control" placeholder="Nhập mật khẩu"
                                            required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Xác Nhận Mật Khẩu</label>
                                        <input type="password" class="form-control" placeholder="Xác nhận mật khẩu"
                                            required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label d-block">Giới Tính</label>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="gender" checked>
                                            <label class="form-check-label">Nam</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="gender">
                                            <label class="form-check-label">Nữ</label>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Ngôn Ngữ</label>
                                        <select class="form-select" required>
                                            <option value="">-- Chọn ngôn ngữ --</option>
                                            <option>Tiếng Việt</option>
                                            <option>Tiếng Anh</option>
                                        </select>
                                    </div>

                                    <div class="form-check mb-3">
                                        <input class="form-check-input" type="checkbox" required>
                                        <label class="form-check-label">
                                            Tôi đồng ý với các điều khoản và điều kiện
                                        </label>
                                        <div class="invalid-feedback">
                                            Bạn phải đồng ý trước khi đăng ký
                                        </div>
                                    </div>

                                    <button class="btn btn-primary">Đăng Ký</button>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="login" role="tabpanel">
                                <h4 class="mb-3">Form Đăng Nhập</h4>

                                <form class="was-validated">
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="Nhập email" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Mật Khẩu</label>
                                        <input type="password" class="form-control" placeholder="Nhập mật khẩu"
                                            required>
                                    </div>

                                    <button class="btn btn-primary">Đăng Nhập</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
