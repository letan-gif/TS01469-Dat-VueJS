<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Trang xem phim</title>
</head>

<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="border p-4 rounded">
                    <h4 class="mb-3">Form Đăng Nhập</h4>
                    <form class="was-validated">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Nhập email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật Khẩu</label>
                            <input type="password" class="form-control" placeholder="Nhập mật khẩu" required>
                        </div>
                        <button type="submit" class="btn btn-success">
                            Đăng Nhập
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script>
        const loginForm = document.querySelector('form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const emailInput = document.querySelector('input[type="email"]').value;
            const passwordInput = document.querySelector('input[type="password"]').value;

            // 1. Lấy dữ liệu GỐC (signup) để đối chiếu
            // Trong file Dangnhap.html
            // Trong script của DangNhap.html
            const savedEmail = localStorage.getItem('accountEmail');
            const savedPassword = localStorage.getItem('accountPassword');

            if (emailInput === savedEmail && passwordInput === savedPassword) {
                // Chỉ lưu biến này khi đăng nhập thành công
                localStorage.setItem('isLoggedIn', emailInput);
                alert('Đăng nhập thành công!');
                window.location.href = 'index.html';
            } else {
                alert('Sai email hoặc mật khẩu!');
            }
        });
    </script>
</body>

</html>
