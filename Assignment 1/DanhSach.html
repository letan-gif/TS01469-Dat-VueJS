<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Trang xem phim</title>
</head>

<body class="bg-light">

   <nav class="navbar navbar-expand-lg sticky-top shadow-sm border-bottom" style="background-color: #e3f2fd;">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="/Assignment 1/images/Logo-phim.png" alt="Logo" width="130">
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-primary px-3" href="index.html"><i class="fa-solid fa-house me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="DangPhim.html"><i class="fa-solid fa-cloud-arrow-up text-primary me-1"></i>Đăng phim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="BinhLuan.html"><i class="fa-solid fa-comments text-primary me-1"></i>Bình luận</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="GioiThieu.html"><i class="fa-solid fa-address-card text-primary me-1"></i>Giới thiệu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="DanhSach.html"><i class="fa-solid fa-address-card text-primary me-1"></i>Danh sách</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center" id="auth-buttons">
                    <a href="Dangky.html" class="btn btn-white bg-white border rounded-pill px-4 me-2 shadow-sm">Đăng ký</a>
                    <a href="DangNhap.html" class="btn btn-primary rounded-pill px-4 shadow-sm">Đăng nhập</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary"><i class="fa-solid fa-bookmark me-2"></i>DANH SÁCH PHIM ĐÃ LƯU</h2>
            <span id="movieCountBadge" class="badge bg-primary rounded-pill fs-6 px-3 py-2">0 Phim</span>
        </div>

        <div id="listCard" class="card shadow-sm border-0 rounded-3 overflow-hidden d-none">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 py-3 text-secondary">Phim</th>
                                <th class="text-secondary">Thể loại</th>
                                <th class="text-secondary">Trạng thái</th>
                                <th class="text-center text-secondary">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="watchListTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="emptyMessage" class="text-center mt-5 py-5 bg-white rounded-3 shadow-sm border">
            <i class="fa-solid fa-folder-open fa-5x text-muted mb-3" style="opacity: 0.3;"></i>
            <p class="fs-4 text-muted fw-bold">Danh sách của bạn đang trống.</p>
            <a href="index.html" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">Khám phá phim ngay</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Xử lý đăng nhập (Đồng bộ Navbar)
            const authSection = document.getElementById('auth-buttons');
            const user = localStorage.getItem('isLoggedIn');
            
            if (user) {
                authSection.innerHTML = `
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-primary fw-bold" href="#" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-circle-user me-1"></i> ${user}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow mt-2">
                            <li><a class="dropdown-item" href="GioiThieu.html">Thông tin cá nhân</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="btnLogout">Đăng xuất</a></li>
                        </ul>
                    </li>`;

                document.getElementById('btnLogout').addEventListener('click', function() {
                    localStorage.removeItem('isLoggedIn');
                    location.reload();
                });
            }

            // Gọi hàm hiển thị danh sách
            renderTable();
        });

        function renderTable() {
            const tableBody = document.getElementById('watchListTableBody');
            const listCard = document.getElementById('listCard');
            const emptyMessage = document.getElementById('emptyMessage');
            const badge = document.getElementById('movieCountBadge');
            
            // Lấy dữ liệu 'myWatchList' từ bộ nhớ
            const myList = JSON.parse(localStorage.getItem('myWatchList')) || [];
            badge.innerText = myList.length + " Phim";

            if (myList.length === 0) {
                listCard.classList.add('d-none');
                emptyMessage.classList.remove('d-none');
            } else {
                listCard.classList.remove('d-none');
                emptyMessage.classList.add('d-none');
                
                tableBody.innerHTML = '';
                myList.forEach((movie, index) => {
                    tableBody.innerHTML += `
                        <tr>
                            <td class="ps-4 py-3">
                                <div class="d-flex align-items-center">
                                    <img src="${movie.image}" class="rounded shadow-sm me-3" 
                                         style="width: 70px; height: 100px; object-fit: cover;">
                                    <div>
                                        <h6 class="fw-bold mb-0 text-dark">${movie.title}</h6>
                                        <small class="text-muted small">ID: #${index + 2024}</small>
                                    </div>
                                </div>
                            </td>
                            <td><span class="badge bg-info text-dark rounded-pill px-3">Hành động</span></td>
                            <td><span class="text-success fw-bold small"><i class="fa-solid fa-circle-check me-1"></i>Đã lưu</span></td>
                            <td class="text-center">
                                <button onclick="goDetail(${index})" class="btn btn-outline-primary btn-sm rounded-pill px-3 me-2">
                                    <i class="fa-solid fa-eye me-1"></i> Xem
                                </button>
                                <button onclick="deleteMovie(${index})" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                    <i class="fa-solid fa-trash-can me-1"></i> Xóa
                                </button>
                            </td>
                        </tr>`;
                });
            }
        }

        // Xóa phim khỏi bộ nhớ thật
        function deleteMovie(index) {
            if (confirm("Bạn có chắc muốn xóa phim này?")) {
                let data = JSON.parse(localStorage.getItem('myWatchList'));
                data.splice(index, 1);
                localStorage.setItem('myWatchList', JSON.stringify(data));
                renderTable(); // Vẽ lại bảng ngay lập tức
            }
        }

        // Xem phim
        function goDetail(index) {
            const data = JSON.parse(localStorage.getItem('myWatchList'));
            sessionStorage.setItem('selectedMovie', JSON.stringify(data[index]));
            window.location.href = 'BinhLuan.html';
        }
    </script>
</body>
</html>
