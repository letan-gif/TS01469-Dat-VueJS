<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Trang xem phim</title>
</head>

<body class="bg-light">
   <nav class="navbar navbar-expand-lg sticky-top shadow-sm border-bottom" style="background-color: #e3f2fd;">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="/Assignment 1/images/Logo-phim.png" alt="Logo" width="130">
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-primary px-3" href="index.html"><i class="fa-solid fa-house me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="DangPhim.html"><i class="fa-solid fa-cloud-arrow-up text-primary me-1"></i>Đăng phim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="BinhLuan.html"><i class="fa-solid fa-comments text-primary me-1"></i>Bình luận</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="GioiThieu.html"><i class="fa-solid fa-address-card text-primary me-1"></i>Giới thiệu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="DanhSach.html"><i class="fa-solid fa-address-card text-primary me-1"></i>Danh sách</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center" id="auth-buttons">
                    <a href="Dangky.html" class="btn btn-white bg-white border rounded-pill px-4 me-2 shadow-sm">Đăng ký</a>
                    <a href="DangNhap.html" class="btn btn-primary rounded-pill px-4 shadow-sm">Đăng nhập</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-4 border-0">
                        <h3 class="mb-1 fw-bold">THÔNG TIN CÁ NHÂN</h3>
                        <p class="mb-0 small opacity-75">Quản lý hồ sơ tài khoản của bạn</p>
                    </div>

                    <div class="card-body p-4 p-md-5 bg-white">
                        <div class="text-center mb-5">
                            <div class="d-inline-block position-relative">
                                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" 
                                     id="previewAvatar"
                                     class="rounded-circle border border-4 border-light shadow" 
                                     width="150" height="150" style="object-fit: cover;">
                                
                                <label for="uploadAvatar" class="btn btn-dark btn-sm position-absolute bottom-0 end-0 rounded-circle p-2 shadow">
                                    <i class="fa-solid fa-camera p-1"></i>
                                </label>
                                <input type="file" id="uploadAvatar" hidden accept="image/*">
                            </div>
                            <h4 class="mt-3 fw-bold text-dark" id="displayUserName">Tên Người Dùng</h4>
                        </div>

                        <form id="profileForm">
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-muted">Họ và tên</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-primary"></i></span>
                                    <input type="text" class="form-control form-control-lg bg-light border-start-0 fs-6" id="fullName" placeholder="Nhập tên mới...">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-muted">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-primary"></i></span>
                                    <input type="email" class="form-control form-control-lg bg-light border-start-0 fs-6" id="email" value="user@gmail.com">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-muted">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-primary"></i></span>
                                    <input type="password" class="form-control form-control-lg bg-light border-start-0 fs-6" id="password" placeholder="Để trống nếu không đổi">
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-5">
                                <button type="button" class="btn btn-primary btn-lg fw-bold rounded-pill py-3 shadow" onclick="saveProfile()">
                                    LƯU THÔNG TIN CẬP NHẬT
                                </button>
                                <a href="index.html" class="btn btn-link text-decoration-none text-muted fw-semibold">Quay lại trang chủ</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const authSection = document.getElementById('auth-buttons');
            const userSession = localStorage.getItem('isLoggedIn');

            if (userSession) {
                // Đã đăng nhập: Hiện dropdown tên người dùng
                authSection.innerHTML = `
                    <div class="dropdown">
                        <button class="btn btn-outline-primary dropdown-toggle rounded-pill px-4" type="button" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-circle-user me-1"></i> ${userSession}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2">
                            <li><a class="dropdown-item py-2" href="index.html">Về trang chủ</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item py-2 text-danger" href="#" id="btnLogout"><i class="fa-solid fa-power-off me-2"></i>Đăng xuất</a></li>
                        </ul>
                    </div>
                `;

                document.getElementById('displayUserName').innerText = userSession;
                document.getElementById('fullName').value = userSession;

                document.getElementById('btnLogout').onclick = function() {
                    localStorage.removeItem('isLoggedIn');
                    window.location.href = 'index.html';
                };
            }
        });

        function saveProfile() {
            const name = document.getElementById('fullName').value;
            if(name.trim() !== "") {
                localStorage.setItem('isLoggedIn', name);
                alert('Cập nhật thành công!');
                window.location.reload();
            }
        }

        document.getElementById('uploadAvatar').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('previewAvatar').src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
