<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Đăng phim mới</title>
</head>
<body class="bg-light">
   <nav class="navbar navbar-expand-lg sticky-top shadow-sm border-bottom" style="background-color: #e3f2fd;">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="/Assignment 1/images/Logo-phim.png" alt="Logo" width="130">
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-primary px-3" href="index.html"><i
                                class="fa-solid fa-house me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="DangPhim.html"><i
                                class="fa-solid fa-cloud-arrow-up text-primary me-1"></i>Đăng phim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="BinhLuan.html"><i
                                class="fa-solid fa-comments text-primary me-1"></i>Bình luận</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="GioiThieu.html"><i
                                class="fa-solid fa-address-card text-primary me-1"></i>Giới thiệu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="DanhSach.html"><i
                                class="fa-solid fa-address-card text-primary me-1"></i>Danh sách</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center" id="auth-buttons">
                    <a href="Dangky.html" class="btn btn-white bg-white border rounded-pill px-4 me-2 shadow-sm">Đăng
                        ký</a>
                    <a href="DangNhap.html" class="btn btn-primary rounded-pill px-4 shadow-sm">Đăng nhập</a>
                </div>
            </div>
        </div>
    </nav>


    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow border-0 p-4 rounded-4">
                    <h3 class="text-center text-primary fw-bold mb-4">ĐĂNG PHIM MỚI</h3>
                    <form id="movieForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiêu đề phim:</label>
                            <input type="text" id="tle" class="form-control" placeholder="Nhập tên phim..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nội dung tóm tắt:</label>
                            <textarea id="cot" class="form-control" rows="4" placeholder="Viết mô tả ngắn..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chọn ảnh bìa:</label>
                            <input type="file" id="imgFile" class="form-control" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill">
                            <i class="fa-solid fa-paper-plane me-2"></i>ĐĂNG PHIM NGAY
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 1. Xử lý hiển thị User trên Navbar
            const authSection = document.getElementById('auth-buttons');
            const user = localStorage.getItem('isLoggedIn');

            if (user) {
                authSection.innerHTML = `
                    <div class="dropdown">
                        <button class="btn btn-outline-primary dropdown-toggle rounded-pill px-4 shadow-sm fw-bold" data-bs-toggle="dropdown">
                            Hi, ${user}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 rounded-3">
                            <li><a class="dropdown-item" href="GioiThieu.html">Cá nhân</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Đăng xuất</a></li>
                        </ul>
                    </div>`;
            }

            // 2. Xử lý Form Đăng Phim
            const movieForm = document.getElementById('movieForm');
            movieForm.addEventListener('submit', function (e) {
                e.preventDefault();

                if (!user) {
                    alert("Vui lòng đăng nhập trước khi đăng phim!");
                    window.location.href = 'DangNhap.html';
                    return;
                }

                const fileInput = document.getElementById('imgFile');
                const file = fileInput.files[0];
                const reader = new FileReader();

                // Đọc file ảnh và chuyển sang chuỗi Base64 để lưu vào localStorage
                reader.onload = function (event) {
                    const newMovie = {
                        title: document.getElementById('tle').value,
                        content: document.getElementById('cot').value,
                        image: event.target.result, // Dữ liệu ảnh dạng chuỗi
                        author: user,
                        date: new Date().toLocaleDateString('vi-VN')
                    };

                    let movies = JSON.parse(localStorage.getItem('userMovies')) || [];
                    movies.unshift(newMovie);
                    localStorage.setItem('userMovies', JSON.stringify(movies));

                    alert("Chúc mừng! Phim của bạn đã được đăng thành công.");
                    window.location.href = 'index.html';
                };

                if (file) {
                    reader.readAsDataURL(file);
                } else {
                    alert("Vui lòng chọn một ảnh cho phim!");
                }
            });
        });

        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload();
        }
    </script>
</body>
</html>
