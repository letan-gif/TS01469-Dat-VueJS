<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Trang xem phim</title>
</head>

<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="border p-4 rounded">
                    <h4 class="mb-3 text-center">Form Đăng Ký Thông Tin</h4>

                    <form class="was-validated">
                        <div class="mb-3">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" placeholder="Nhập họ và tên" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Nhập email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số Điện Thoại</label>
                            <input type="text" class="form-control" placeholder="Nhập số điện thoại" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật Khẩu</label>
                            <input type="password" class="form-control" placeholder="Nhập mật khẩu" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Xác Nhận Mật Khẩu</label>
                            <input type="password" class="form-control" placeholder="Xác nhận mật khẩu" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">Giới Tính</label>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="male" checked>
                                <label class="form-check-label" for="male">Nam</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="female">
                                <label class="form-check-label" for="female">Nữ</label>
                            </div>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Ngôn Ngữ</label>
                            <select class="form-select" required>
                                <option value="">-- Chọn ngôn ngữ --</option>
                                <option>Tiếng Việt</option>
                                <option>Tiếng Anh</option>
                            </select>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" required>
                            <label class="form-check-label">
                                Tôi đồng ý với các điều khoản và điều kiện
                            </label>
                            <div class="invalid-feedback">
                                Bạn phải đồng ý trước khi đăng ký
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-content-center">
                            Đăng Ký
                        </button>
                    </form>
                </div>
            </div>
            </template>
            <script>
                const registrationForm = document.querySelector('form');
                registrationForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const email = document.querySelector('input[type="email"]').value;
                    const password = document.querySelector('input[placeholder="Nhập mật khẩu"]').value;

                    // ĐỔI TÊN BIẾN: Thêm chữ 'signup' vào trước
                    // Trong script của Dangky.html
                    localStorage.setItem('accountEmail', email);
                    localStorage.setItem('accountPassword', password);

                    alert('Đăng ký thành công!');
                    window.location.href = 'Dangnhap.html';
                });
            </script>
</body>

</html>
